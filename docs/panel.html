<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Panel LateBets</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #F2F2F7;
    --bg-card: #FFFFFF;
    --text: #14171A;
    --hint: #6B7280;
    --accent: #229ED9;
    --accent-text: #FFFFFF;
    --line: #E5E7EB;
    --track-off: #D1D5DB;
    --on: #34C759;
    --off: #FF3B30;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 90px;
  }

  header {
    padding: 18px 16px 8px;
  }
  header h1 { font-size: 1.25rem; margin: 0 0 2px; font-weight: 700; }
  header p { margin: 0; font-size: 0.85rem; color: var(--hint); }

  nav.tabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px 14px;
  }
  nav.tabs button {
    flex: 1;
    padding: 9px 10px;
    border-radius: 10px;
    border: none;
    background: var(--bg-card);
    color: var(--hint);
    font-size: 0.86rem;
    font-weight: 600;
    font-family: inherit;
  }
  nav.tabs button.active {
    background: var(--accent);
    color: var(--accent-text);
  }

  main { padding: 0 16px; }

  section.view { display: none; flex-direction: column; gap: 12px; }
  section.view.active { display: flex; }

  .card {
    background: var(--bg-card);
    border-radius: 14px;
    overflow: hidden;
  }
  .card .card-title {
    padding: 12px 14px 6px;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--hint);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 14px;
    border-top: 1px solid var(--line);
  }
  .card .card-title + .row { border-top: none; }
  .row .label {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 0.95rem;
  }
  .row .label .emoji { font-size: 1.1rem; }

  .row .bulk {
    display: flex;
    gap: 8px;
  }
  .row .bulk button {
    border: none;
    background: var(--bg);
    color: var(--hint);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 8px;
    font-family: inherit;
  }

  /* switch */
  .switch {
    position: relative;
    width: 46px;
    height: 27px;
    flex: none;
  }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; z-index: 1; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--track-off);
    border-radius: 999px;
    transition: background .15s ease;
  }
  .switch .thumb {
    position: absolute; top: 2px; left: 2px;
    width: 23px; height: 23px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
    transition: transform .15s ease;
  }
  .switch input:checked + .track { background: var(--on); }
  .switch input:checked ~ .thumb { transform: translateX(19px); }

  .stepper {
    display: flex; align-items: center; gap: 14px;
  }
  .stepper button {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--bg);
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 700;
    font-family: inherit;
    line-height: 1;
  }
  .stepper .value {
    min-width: 22px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }

  input[type="time"] {
    border: none;
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    padding: 6px 10px;
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }

  .hint {
    font-size: 0.78rem;
    color: var(--hint);
    padding: 4px 4px 0;
    line-height: 1.4;
  }

  .badge-dirty {
    display: none;
    font-size: 0.72rem;
    background: var(--accent);
    color: var(--accent-text);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }
  body.dirty .badge-dirty { display: inline-block; }
</style>
</head>
<body>

<header>
  <h1>⚙️ Panel LateBets <span class="badge-dirty" id="badge-dirty">sin guardar</span></h1>
  <p>Cambia lo que quieras y pulsa "Guardar cambios" abajo.</p>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-view="view-casas">🏠 Casas y deportes</button>
  <button class="tab-btn" data-view="view-ajustes">🛠 Ajustes</button>
</nav>

<main>
  <section class="view active" id="view-casas"></section>

  <section class="view" id="view-ajustes">
    <div class="card">
      <div class="card-title">Paralelismo</div>
      <div class="row">
        <div class="label">Scrapers a la vez</div>
        <div class="stepper">
          <button type="button" id="par-menos">−</button>
          <span class="value" id="par-valor">2</span>
          <button type="button" id="par-mas">+</button>
        </div>
      </div>
      <div class="hint" style="padding:0 14px 12px;">Más alto no siempre es más rápido — depende de tu máquina.</div>
    </div>

    <div class="card">
      <div class="card-title">Ejecución diaria</div>
      <div class="row">
        <div class="label">Hora</div>
        <input type="time" id="input-hora" value="00:00">
      </div>
    </div>

    <div class="card">
      <div class="card-title">Notificaciones</div>
      <div class="row">
        <div class="label">Modo verboso</div>
        <label class="switch">
          <input type="checkbox" id="input-verboso">
          <span class="track"></span>
          <span class="thumb"></span>
        </label>
      </div>
      <div class="hint" style="padding:0 14px 12px;">Añade los tiempos por etapa al resumen de cada ejecución.</div>
    </div>
  </section>
</main>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;

  // ---------- tema nativo de Telegram ----------
  function aplicarTema() {
    if (!tg) return;
    const t = tg.themeParams || {};
    const root = document.documentElement.style;
    if (t.bg_color) root.setProperty('--bg', t.bg_color);
    if (t.secondary_bg_color) root.setProperty('--bg-card', t.secondary_bg_color);
    if (t.text_color) root.setProperty('--text', t.text_color);
    if (t.hint_color) root.setProperty('--hint', t.hint_color);
    if (t.button_color) root.setProperty('--accent', t.button_color);
    if (t.button_text_color) root.setProperty('--accent-text', t.button_text_color);
  }

  // ---------- estado ----------
  const params = new URLSearchParams(location.search);
  let estado = { c: [], p: 2, h: "00:00", v: false };
  try {
    if (params.get('estado')) {
      estado = JSON.parse(decodeURIComponent(escape(atob(params.get('estado').replace(/-/g, '+').replace(/_/g, '/')))));
    }
  } catch (e) {
    console.error('No se pudo leer el estado', e);
  }

  const cambiosToggle = {}; // "casaId:deporteId" -> nuevoValor
  let paralelismoActual = estado.p;
  const paralelismoInicial = estado.p;
  let horaInicial = estado.h;
  let verbosoInicial = !!estado.v;

  function marcarSucio() {
    const hayToggles = Object.keys(cambiosToggle).length > 0;
    const hayParalelismo = paralelismoActual !== paralelismoInicial;
    const hayHora = document.getElementById('input-hora').value !== horaInicial;
    const hayVerboso = document.getElementById('input-verboso').checked !== verbosoInicial;
    const sucio = hayToggles || hayParalelismo || hayHora || hayVerboso;
    document.body.classList.toggle('dirty', sucio);
    if (tg) {
      if (sucio) { tg.MainButton.enable(); tg.MainButton.setText('💾 Guardar cambios'); }
      else { tg.MainButton.disable(); tg.MainButton.setText('Sin cambios'); }
    }
  }

  // ---------- pestañas ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.view).classList.add('active');
    });
  });

  // ---------- render casas ----------
  const contenedorCasas = document.getElementById('view-casas');
  estado.c.forEach(casa => {
    const card = document.createElement('div');
    card.className = 'card';

    const titulo = document.createElement('div');
    titulo.className = 'card-title';
    titulo.textContent = casa.n;
    card.appendChild(titulo);

    casa.d.forEach(dep => {
      const row = document.createElement('div');
      row.className = 'row';

      const label = document.createElement('div');
      label.className = 'label';
      label.innerHTML = `<span class="emoji">${dep.e}</span> ${dep.n}`;

      const sw = document.createElement('label');
      sw.className = 'switch';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = dep.a;
      const track = document.createElement('span');
      track.className = 'track';
      const thumb = document.createElement('span');
      thumb.className = 'thumb';
      sw.append(input, track, thumb);

      const clave = casa.id + ':' + dep.id;
      input.addEventListener('change', () => {
        if (input.checked === dep.a) delete cambiosToggle[clave];
        else cambiosToggle[clave] = input.checked;
        marcarSucio();
      });

      row.append(label, sw);
      card.appendChild(row);
    });

    const bulkRow = document.createElement('div');
    bulkRow.className = 'row';
    bulkRow.innerHTML = '<div class="bulk"></div>';
    const bulk = bulkRow.querySelector('.bulk');
    const btnOn = document.createElement('button');
    btnOn.type = 'button';
    btnOn.textContent = '🟢 Activar todo';
    const btnOff = document.createElement('button');
    btnOff.type = 'button';
    btnOff.textContent = '🔴 Desactivar todo';
    bulk.append(btnOn, btnOff);
    bulkRow.style.justifyContent = 'flex-end';
    card.appendChild(bulkRow);

    function fijarTodos(valor) {
      card.querySelectorAll('input[type="checkbox"]').forEach((input, i) => {
        input.checked = valor;
        const dep2 = casa.d[i];
        const clave2 = casa.id + ':' + dep2.id;
        if (valor === dep2.a) delete cambiosToggle[clave2];
        else cambiosToggle[clave2] = valor;
      });
      marcarSucio();
    }
    btnOn.addEventListener('click', () => fijarTodos(true));
    btnOff.addEventListener('click', () => fijarTodos(false));

    contenedorCasas.appendChild(card);
  });

  // ---------- ajustes ----------
  const parValor = document.getElementById('par-valor');
  parValor.textContent = paralelismoActual;
  document.getElementById('par-menos').addEventListener('click', () => {
    paralelismoActual = Math.max(1, paralelismoActual - 1);
    parValor.textContent = paralelismoActual;
    marcarSucio();
  });
  document.getElementById('par-mas').addEventListener('click', () => {
    paralelismoActual = Math.min(8, paralelismoActual + 1);
    parValor.textContent = paralelismoActual;
    marcarSucio();
  });

  document.getElementById('input-hora').value = estado.h;
  document.getElementById('input-hora').addEventListener('input', marcarSucio);

  document.getElementById('input-verboso').checked = verbosoInicial;
  document.getElementById('input-verboso').addEventListener('change', marcarSucio);

  // ---------- guardar ----------
  function guardar() {
    const toggles = Object.entries(cambiosToggle).map(([clave, activo]) => {
      const [c, d] = clave.split(':');
      return { c, d, a: activo };
    });
    const payload = {
      toggles,
      paralelismo: paralelismoActual,
      hora: document.getElementById('input-hora').value,
      verboso: document.getElementById('input-verboso').checked,
    };
    if (tg) {
      tg.sendData(JSON.stringify(payload));
    } else {
      alert('Fuera de Telegram no se puede guardar. Datos: ' + JSON.stringify(payload));
    }
  }

  if (tg) {
    tg.ready();
    tg.expand();
    aplicarTema();
    tg.onEvent('themeChanged', aplicarTema);
    tg.MainButton.setParams({ color: undefined });
    tg.MainButton.setText('Sin cambios');
    tg.MainButton.show();
    tg.MainButton.disable();
    tg.MainButton.onClick(guardar);
  }
</script>
</body>
</html>
